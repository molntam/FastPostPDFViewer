name: Validate extension

on:
  push:
    branches:
      - main
      - 'agent/**'
      - 'fix/**'
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install test dependencies
        run: npm ci --ignore-scripts

      - name: Check JavaScript syntax
        run: npm run check

      - name: Test print orientation and extension behavior
        run: npm test
