name: Validate no-host PDF printing branch

on:
  push:
    branches:
      - agent/ppm-auto-print-no-host
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate extension files
        shell: pwsh
        run: |
          node --check viewer.js
          node -e 'const fs=require("fs"),crypto=require("crypto");const m=JSON.parse(fs.readFileSync("manifest.json","utf8"));if(m.permissions?.includes("nativeMessaging"))throw new Error("nativeMessaging must not be enabled");const der=Buffer.from(m.key,"base64");const h=crypto.createHash("sha256").update(der).digest().subarray(0,16);const id=[...h].map(b=>String.fromCharCode(97+(b>>4),97+(b&15))).join("");if(id!=="oimlipggfonleadilhogfoaekjenbkln")throw new Error("Unexpected extension ID: "+id);'
          if (Test-Path -LiteralPath native-host) {
            throw "The no-host branch must not contain native-host files."
          }
          if (Select-String -Path viewer.js -Pattern "pdf.min.mjs|canvas|connectNative") {
            throw "The no-host branch must not use PDF.js, canvas or native messaging."
          }
