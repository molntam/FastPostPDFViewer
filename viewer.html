<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="google" content="notranslate">
  <title>Preparing print</title>
  <link rel="stylesheet" href="viewer.css">
</head>
<body>
  <div id="busyOverlay" role="status" aria-live="polite">
    <div class="busy-card">
      <div class="spinner" aria-hidden="true"></div>
      <div id="busyText">Preparing print…</div>
      <progress id="busyProgress" max="100" hidden></progress>
      <div id="actions" hidden>
        <button id="retryPrint" type="button">Open print dialog</button>
        <button id="openViewer" type="button">Show Edge viewer</button>
        <button id="downloadPdf" type="button">Download PDF</button>
      </div>
    </div>
  </div>

  <iframe id="pdfFrame" title="PDF document"></iframe>

  <script type="module" src="viewer.js"></script>
</body>
</html>
